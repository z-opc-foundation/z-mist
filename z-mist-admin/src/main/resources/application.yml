# z-mist-admin 演示配置（gitignore: 本仓 .env + application-local.yml 装真实值）
#
# ⚠️ 本文件不含任何明文凭证，全部从环境变量读取
# 本地启动:
#   1. cp .env.example .env  填写真实 SPRING_DATASOURCE_PASSWORD / Z_MIST_MASTER_KEY
#   2. mvn spring-boot:run -pl z-mist-admin (从仓根目录)

spring:
  application:
    name: z-mist-admin
  # SecretController + MistSecurityConfig 使用 @PreAuthorize / @EnableGlobalMethodSecurity
  # 仅用注解方式做权限控制，HTTP filter chain 不需要 Spring Security 默认拦截
  # 由 MistSecurityConfig.securityFilterChain() 显式声明 permitAll() 覆盖默认行为
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # MistModuleDataSource (ModuleDataSourceTemplate) 只读 z.base.db.mist.*,
  # spring.datasource 是死配置且会诱导 spring/druid 自动装配抢跑注册第二个 DataSource,
  # 一律排除 (与 z-task 标准对齐, 见 lead/005_技术架构/007 SOP 步骤 3)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - com.alibaba.druid.spring.boot.autoconfigure.DruidDataSourceAutoConfigure
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# 数据源走 ModuleDataSourceTemplate 模板 (buildDataSource(env, "mist")),
# 无 XML mapper 且 mapUnderscoreToCamelCase 为 MybatisConfiguration 默认 true,
# 因此原 mybatis-plus.* 自动配置块不再需要 (yml 该段已删除)
z:
  base:
    db:
      mist:
        host: ${Z_MIST_DB_HOST:127.0.0.1}
        port: ${Z_MIST_DB_PORT:3306}
        database: ${Z_MIST_DB_NAME:z_mist}
        username: ${Z_MIST_DB_USER:root}
        password: ${Z_MIST_DB_PASSWORD:}
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000

logging:
  level:
    com.zifang.z.mist: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ⚠️ 原先这里有 `z-mist.server.port: 9085` 与 `z-mist.master-key: ${Z_MIST_MASTER_KEY:...}`，
#    三处都是死配置，已删除（实测：全仓零 @ConfigurationProperties，Spring 不会去绑定 z-mist.* 命名空间）：
#      1) z-mist.server.port —— 端口要用顶层 `server.port`；z-mist.* 没有任何类在绑定，服务实际听 8080。
#      2) z-mist.master-key  —— 主密钥只从两处读（ZMistSecretServiceImpl.resolveMasterKey）：
#           JVM 参数 -Dz-mist.master-key=xxx
#           环境变量 Z_MIST_MASTER_KEY=xxx
#         两者都没给时落到源码里的 DEFAULT_MASTER_KEY 并打 warn。yml 这行（含它写的 dev 兜底值）永不生效，
#         写在这里会让人以为改了 yml 就换掉了主密钥。
#      3) logging.level.io.github.yuku123.z.mist —— 早期包名，本仓 129 个 Java 文件已全部是 com.zifang.z.mist，
#         这个 logger 名匹配不到任何类。已按实际包名改回 com.zifang.z.mist。

# FEATURE022: z-ctc SSO 集成（可选；不配则匿名访问）
# z-ctc:
#   sso:
#     enabled: true
#     callback-url: http://localhost:8080/api/sso/callback

# FEATURE022: 接口限流（防爆破）。当前 GET/PUT 每分钟阈值是 SecretController 里的硬编码常量
# (GET_PER_MIN=60 / PUT_PER_MIN=10)，本仓没有 @ConfigurationProperties，暂无对应配置项；
# 下面这段是"打算支持"的形态，不生效。
# z-mist:
#   rate-limit:
#     secret-get-per-minute: 60
#     secret-put-per-minute: 10
#     secret-delete-per-minute: 5
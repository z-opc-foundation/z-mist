# z-mist-admin 演示配置（gitignore: 本仓 .env + application-local.yml 装真实值）
#
# ⚠️ 本文件不含任何明文凭证，全部从环境变量读取
# 本地启动:
#   1. cp .env.example .env  填写真实 SPRING_DATASOURCE_PASSWORD / Z_MIST_MASTER_KEY
#   2. mvn spring-boot:run -pl z-mist-admin (从仓根目录)

spring:
  application:
    name: z-mist-admin
  # SecretController + MistSecurityConfig 使用 @PreAuthorize / @EnableGlobalMethodSecurity
  # 仅用注解方式做权限控制，HTTP filter chain 不需要 Spring Security 默认拦截
  # 由 MistSecurityConfig.securityFilterChain() 显式声明 permitAll() 覆盖默认行为
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dev}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}    # ✅ 必须从环境变量读, 严禁明文
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: io.github.yuku123.z.mist.core.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.log4j2.Log4j2Impl

logging:
  level:
    io.github.yuku123.z.mist: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

z-mist:
  server:
    port: 9085
  # 主密钥外部化。生产必须通过环境变量注入；application.yml 这里只是 dev 兜底。
  # 真实使用请设置环境变量 Z_MIST_MASTER_KEY
  master-key: ${Z_MIST_MASTER_KEY:change-me-please-set-env-Z_MIST_MASTER_KEY}

